services:
  ollama:
    image: ollama/ollama:0.32.9
    container_name: profile-intelligence-ollama

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "10m"

    volumes:
      - ollama-models:/root/.ollama

    networks:
      - ai-model-private

    restart: unless-stopped

  profile-intelligence-api:
    image: ${AI_IMAGE}:${AI_VERSION}
    container_name: profile-intelligence-api

    depends_on:
      - ollama

    ports:
      - "${AI_BIND_IP}:${AI_PORT}:8080"

    environment:
      AI_ALLOWED_ORIGINS: "${AI_ALLOWED_ORIGINS}"
      AI_ALLOWED_HOSTS: "${AI_ALLOWED_HOSTS}"

      AI_ENABLE_DOCS: "${AI_ENABLE_DOCS}"
      AI_MAX_CONTENT_LENGTH: "${AI_MAX_CONTENT_LENGTH}"

      AI_LLM_ENABLED: "true"
      AI_LLM_BASE_URL: "http://ollama:11434"
      AI_LLM_ALLOWED_HOSTS: "ollama"

      AI_LLM_MODEL: "${AI_LLM_MODEL}"
      AI_LLM_TIMEOUT_SECONDS: "180"
      AI_LLM_TEMPERATURE: "0.15"
      AI_LLM_MAX_PREDICT: "900"
      AI_LLM_MAX_EVIDENCE: "72"
      AI_LLM_HISTORY_MESSAGES: "8"

    read_only: true

    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      - ai-host
      - ai-model-private

    restart: unless-stopped

networks:
  ai-host:
    driver: bridge

  ai-model-private:
    driver: bridge
    internal: true

volumes:
  ollama-models:
    name: profile-intelligence-ollama-models
